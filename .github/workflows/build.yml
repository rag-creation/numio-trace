name: Build Trace Test

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build test APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Make sure there is no internet permission
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions app/build/outputs/apk/debug/*.apk | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then
            echo "::error::INTERNET permission found in the APK. Numio apps must stay offline."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Trace-Test-APK
          path: app/build/outputs/apk/debug/*.apk
